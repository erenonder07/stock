name: AVVA Beden Stok Kontrolü

on:
  schedule:
    # Her 15 dakikada bir otomatik çalışır
    - cron: '*/15 * * * *'
  workflow_dispatch: # GitHub arayüzünden manuel olarak tetikleme imkanı sağlar

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Çalışma Alanına Çek (Checkout)
        uses: actions/checkout@v4

      - name: Python 3.10 Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stok Takip Botunu Çalıştır
        env:
          PRODUCT_URL: ${{ secrets.PRODUCT_URL }}
          TARGET_SIZE: ${{ secrets.TARGET_SIZE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py
